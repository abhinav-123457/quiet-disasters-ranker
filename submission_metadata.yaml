ai_usage_summary: |
  We used LLMs as assisted-engineering tools, driven by our own audits and design
  decisions. For the finalization of our architecture we held the debate between 
  ChatGPT and Opus 4.8 on our architecture about pro and cons and after that
  one they both come to agree on final architecture and the procedure we started
  developing our MVP / Prototype .
  The architecture, feature design, weighting, dataset schema mapping, and all
  validation were done by the human team. We wrote detailed audits of our pipeline
  and fed those to the LLM to refine specific components.
  LLM assistance was concentrated on two implementation areas: the batch-optimized
  FAISS retrieval logic, and the edge-case logic for our two-layer honeypot
  detection. The remaining components — the 7-feature scoring model, the reasoning
  generator, the penalty system, and all calibration — were designed and written
  by the team, with the LLM used for code review and debugging.
  No candidate data was sent to any hosted LLM during ranking; the ranking step
  runs fully offline on CPU.
  
methodology_summary: |
  Our system uses a deterministic, multi-stage retrieval and ranking pipeline that
  runs completely offline on CPU in about 60 seconds — well within the 5-minute
  budget. Stage 1 addresses the cold-start problem with a fast FAISS vector search
  combined with boolean skill filters, reducing 100K candidates to a high-recall
  pool of 500. Stage 2 applies a lightweight, CPU-optimized cross-encoder to
  re-rank those 500, extracting deep job-description relevance that bi-encoders
  miss. Stage 3 computes the final ranking with a 7-feature weighted model:
  career domain evidence (32%), search/retrieval expertise (26%), production
  deployment (15%), vector-DB infrastructure (10%), behavioral availability (10%,
  capped), LLM-adjacent experience (4%), and career progression (3%). We apply
  multiplicative penalties to demote low-quality matches: services firms without
  product-company evidence receive 0.4x–0.8x, keyword stuffers 0.2x, and impossible
  "honeypot" profiles are caught by a strict two-layer detector. A final reasoning
  step builds non-templated justifications grounded in each candidate's actual skill
  durations, endorsements, and career trajectory, keeping every rank transparent and
  avoiding hallucinated claims.
